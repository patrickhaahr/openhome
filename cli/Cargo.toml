[package]
name = "openhome-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "openhome"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# Groups sit below individual lints so the per-lint levels below win.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Hand-picked nursery/restriction lints worth having without the whole group
redundant_clone = "deny"
needless_collect = "warn"
dbg_macro = "warn"
todo = "warn"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "env"] }
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1.0.149"
