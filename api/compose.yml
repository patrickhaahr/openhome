services:
  openhome-api:
    image: patrickhaahr/openhome-api:0.4.0
    container_name: openhome-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NOOP_PUSH_TOKEN: ${NOOP_PUSH_TOKEN:?Set NOOP_PUSH_TOKEN in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$API_KEY\" http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - caddy

  openhome-mcp:
    image: patrickhaahr/openhome-mcp:0.1.0
    container_name: openhome-mcp
    restart: unless-stopped
    depends_on:
      openhome-api:
        condition: service_healthy
    environment:
      OPENHOME_API_URL: http://openhome-api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-openhome.haahr.me}
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' -H \"Authorization: Bearer $$API_KEY\" http://localhost:8001/mcp); [ \"$$code\" != 000 ] && [ \"$$code\" != 401 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - caddy

networks:
  caddy:
    external: true
