[package]
name = "openhome-api"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22"
bollard = { version = "0.20.0", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15.7"
http = "1.4.0"
reqwest = { version = "0.13.1", features = ["form", "json"] }
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
feed-rs = "0.3"
futures-util = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
flate2 = "1.1.10"
sha2 = "0.10"

[dev-dependencies]
axum = { version = "0.8.8", features = ["macros"] }
hyper = "1.8.1"
pretty_assertions = "1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
wiremock = "0.6"

[profile.release]
opt-level = "s"      # Optimize for size with good performance balance
lto = true           # Link-Time Optimization for smaller binary
codegen-units = 1    # Better optimization at cost of compile time
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip debug symbols

[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# Groups sit below individual lints so the per-lint levels below win.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Hand-picked nursery/restriction lints worth having without the whole group
redundant_clone = "deny"
needless_collect = "warn"
dbg_macro = "warn"
todo = "warn"
# serde/sqlx tri-state: absent vs explicit null vs value is the PATCH contract
option_option = "allow"
# long SQL assemblies and integration-test scenarios stay one unit
too_many_lines = "allow"
# domain names end in _id; test fixtures carry full-precision floats
struct_field_names = "allow"
unreadable_literal = "allow"
# errors are typed and thiserror-driven; doc sections would restate signatures
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# deliberate conversions between timestamps/counts and f64/limits
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
