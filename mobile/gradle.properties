org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# With devenv's SDK AAPT2, AGP 9.5's optimize task emits metadata but no resource
# archive. Package the linked resources directly so release APKs retain their manifest.
android.enableResourceOptimizations=false
